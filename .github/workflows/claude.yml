name: Claude Code

# Mention @claude in an issue, a comment, or a pull request review to have Claude
# work on it. Only people with write access to this repository can trigger it.
# Needs one repository secret: CLAUDE_CODE_OAUTH_TOKEN (Claude Pro/Max, from
# `claude setup-token`) or ANTHROPIC_API_KEY (from the Claude Console).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on pull requests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Set whichever of these secrets you have; the other can stay unset.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Let Claude rebuild the question data and syntax-check the app.
          claude_args: |
            --allowedTools "Bash(python3 scripts/build_questions.py),Bash(node --check:*)"
